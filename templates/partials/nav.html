{% load static %}
<header class="site-header">
  <div class="container nav-wrap">
    <a class="brand" href="{% url 'core:home' %}">
      <span class="brand-mark"><i class="fa-solid fa-house-chimney"></i></span>
      <span>Home<span>Heaven</span></span>
    </a>
    <nav class="main-nav">
      <a href="{% url 'listings:list' %}">Search homes</a>
      <a href="{% url 'core:how_it_works' %}">How it works</a>
      <a href="{% url 'core:about' %}">About</a>
      <a href="{% url 'core:contact' %}">Contact</a>
    </nav>
    <div class="nav-actions">
      {% if user.is_authenticated %}
        <a class="icon-link" href="{% url 'listings:saved' %}" title="Saved homes"><i class="fa-regular fa-heart"></i></a>
        <a class="icon-link" href="{% url 'accounts:dashboard' %}" title="Dashboard"><i class="fa-regular fa-user"></i></a>
        <form method="post" action="{% url 'accounts:logout' %}" class="inline-form">{% csrf_token %}<button class="btn btn-ghost btn-sm" type="submit">Logout</button></form>
      {% else %}
        <a class="btn btn-ghost btn-sm" href="{% url 'accounts:login' %}">Login</a>
        <a class="btn btn-primary btn-sm" href="{% url 'accounts:signup' %}">Sign up</a>
      {% endif %}
    </div>
  </div>
</header>
